# Apex is the canonical host — the outer Caddy 301s www to this. baseURL drives
# canonical tags, og:url, sitemap locs and schema.org url/@id, so a www value
# here would point every one of them at a redirect.
baseURL = 'https://traverhardwoodfloors.com/'
languageCode = 'en-us'
title = 'Traver Hardwood Floors'

# Use git commit dates for sitemap lastmod on pages without a date in front matter
enableGitInfo = true

# No categories or tags — an empty block disables the default taxonomies so
# Hugo stops emitting thin /categories/ and /tags/ pages into the sitemap.
[taxonomies]

[params]
  description = 'Hardwood floor installation, refinishing & restoration in Helena & Bozeman. 18 years, water-based finishes, historic homes. Free estimates.'
  tagline = '18 Years. Montana Roots. Your Floors.'
  turnstileSiteKey = '0x4AAAAAACHajsaw-K1k5996'
  phone = '406-451-2282'
  phoneFormatted = '(406) 451-2282'
  phoneTel = '+1-406-451-2282'
  location = 'Helena, Montana'

  [params.social]
    facebook = 'https://www.facebook.com/traverhardwoodfloors'
    instagram = 'https://www.instagram.com/traverhardwoodfloors'
    nextdoor = 'https://nextdoor.com/pages/traver-hardwood-floors-helena-mt'
    google = 'https://www.google.com/maps/place/Traver+Hardwood+Floors/@46.1302274,-112.193272,9z/'

